name: JIRA Clone CI/CD Pipeline

on:
  # Triggers on a push to ANY branch (the ** acts as a wildcard)
  push:
    branches: [ "**" ]
  # Keeps PRs covered
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  # ----------------------------------------------------
  # 1. TEST ALL BACKEND SERVICES (Runs on EVERY push)
  # ----------------------------------------------------
  test-backend:
    name: Test All Spring Boot Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Multi-Module Tests
        run: mvn test

  # ----------------------------------------------------
  # 2. BUILD AND PUSH DOCKER IMAGES (Runs ONLY on main/develop)
  # ----------------------------------------------------
  build-and-push-images:
    name: Build & Push Images
    needs: test-backend
    # THE GATEKEEPER: This ensures the job is skipped entirely on feature branches
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - config-server
          - api-gateway
          - auth-service
          - project-service
          - planning-service
          - task-service
          - frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          # We can hardcode push to true now, because this job ONLY runs when we want to push
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max