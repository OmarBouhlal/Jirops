name: JIRA Clone CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  test-backend:
    name: Test All Spring Boot Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run Maven Multi-Module Tests
        run: mvn test

  build-and-push-images:
    name: Build & Push Images
    needs: test-backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka-server
            context: .
            dockerfile: ./eureka-server/Dockerfile
            tag: eureka-server
          - service: config-server
            context: .
            dockerfile: ./config-server/Dockerfile
            tag: config-server
          - service: api-gateway
            context: .
            dockerfile: ./api-gateway/Dockerfile
            tag: api-gateway
          - service: auth-service
            context: .
            dockerfile: ./auth-service/Dockerfile
            tag: auth-service
          - service: project-service
            context: .
            dockerfile: ./project-service/Dockerfile
            tag: project-service
          - service: planning-service
            context: .
            dockerfile: ./planning-service/Dockerfile
            tag: planning-service
          - service: task-service
            context: .
            dockerfile: ./task-service/Dockerfile
            tag: task-service
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            tag: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.tag }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
